{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DudhDairy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #33334d 0%, #6d5c6a 60%, #ceb0b0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            background: #fff;
            padding: 2.5rem 2rem 2rem 2rem;
            margin-top: 2rem;
        }
        .cow-logo {
            display: block;
            margin: 0 auto 1rem auto;
            width: 300px;
            height: 300px;
            object-fit: contain;
        }
        .brand-title {
            font-family: 'Segoe UI', sans-serif;
            font-size: 2rem;
            font-weight: bold;
            color: #33334d;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .login-btn {
            background: #33334d;
            border: none;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .login-btn:hover {
            background: #6d5c6a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card shadow">
                    <!-- Cow logo: replace static/img/cow.png with your own image if desired -->
                    <img src="{% static 'img/cow.png' %}" alt="Cow Logo" class="cow-logo" onerror="this.style.display='none'">
                    <div class="brand-title">DudhDairy</div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" id="id_username" required>
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" id="id_password" required>
                        </div>
                        {% if form.errors %}
                            <div class="alert alert-danger">
                                Your username and password didn't match. Please try again.
                            </div>
                        {% endif %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn login-btn btn-lg text-white">Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
